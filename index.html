@media (min-width:820px){.two{grid-template-columns:1.25fr 1fr}}

@media (max-width:819px){.stickym{top:58px;padding:8px 10px}.stickym .meter{margin:2px 0}.stickym .meter .lb{font-size:.8rem}.stickym .btn{padding:6px 12px}.stickym p{margin:4px 0}.qfirst>:last-child{order:-1}.mz{font-size:.68rem;height:28px;min-width:34px;padding:0 5px}}
.opts{display:flex;flex-wrap:wrap;gap:8px}

.kpi{display:flex;gap:8px;flex-wrap:wrap}

<script>
"use strict";
/* ============ UTIL ============ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
function h(tag, attrs = {}, ...kids) {
  const el = document.createElement(tag);
  for (const k in attrs) {
    const v = attrs[k];
    if (k === "class") el.className = v;
    else if (k === "html") el.innerHTML = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) el.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) el.append(c.nodeType ? c : document.createTextNode(c));
  return el;
}
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const fmt = (n, d = 1) => n.toLocaleString("id-ID", { maximumFractionDigits: d, minimumFractionDigits: 0 });

/* ============ STORAGE (opsional) ============ */
const STORE_KEY = "ekspedisi-nusantara-v1";
let S = { name: "", best: {}, muted: false, guru: false };
try { const raw = localStorage.getItem(STORE_KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch (e) {}
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) {} }

/* ============ AUDIO (Web Audio, tanpa file) ============ */
const SND = (() => {
  let ctx = null;
  const ac = () => { if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (ctx && ctx.state === "suspended") ctx.resume(); return ctx; };
  function tone(f, t0, dur, type = "sine", vol = .18) {
    const c = ac(); if (!c || S.muted) return;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, c.currentTime + t0);
    g.gain.setValueAtTime(0, c.currentTime + t0);
    g.gain.linearRampToValueAtTime(vol, c.currentTime + t0 + .02);
    g.gain.exponentialRampToValueAtTime(.001, c.currentTime + t0 + dur);
    o.connect(g).connect(c.destination); o.start(c.currentTime + t0); o.stop(c.currentTime + t0 + dur + .05);
  }
  function noise(dur = .4, vol = .08) {
    const c = ac(); if (!c || S.muted) return;
    const b = c.createBuffer(1, c.sampleRate * dur, c.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
    const s = c.createBufferSource(), g = c.createGain(), f = c.createBiquadFilter();
    f.type = "highpass"; f.frequency.value = 1800; g.gain.value = vol;
    s.buffer = b; s.connect(f).connect(g).connect(c.destination); s.start();
  }
  return {
    click: () => tone(660, 0, .07, "triangle", .1),
    pick: () => tone(520, 0, .08, "triangle", .12),
    ok: () => { tone(660, 0, .12, "triangle"); tone(990, .1, .18, "triangle"); },
    bad: () => { tone(180, 0, .22, "sawtooth", .1); tone(140, .12, .25, "sawtooth", .08); },
    win: () => [523, 659, 784, 1046].forEach((f, i) => tone(f, i * .12, .3, "triangle", .16)),
    drip: () => tone(1400, 0, .05, "sine", .05),
    rain: () => noise(.8, .06),
    wind: () => noise(.6, .04),
    tick: () => tone(880, 0, .04, "square", .04)
  };
})();

/* ============ DRAG & DROP + TAP ============ */
const DnD = {
  sel: null, onDrop: null,
  select(el) {
    if (this.sel) this.sel.classList.remove("sel");
    $$(".dz").forEach(z => z.classList.remove("cansel"));
    if (el && el !== this.sel) { this.sel = el; el.classList.add("sel"); $$(".dz").forEach(z => z.classList.add("cansel")); SND.pick(); }
    else this.sel = null;
  },
  clear() { this.select(null); this.sel = null; $$(".dz").forEach(z => z.classList.remove("cansel", "hover")); },
  make(el) {
    el.addEventListener("pointerdown", e => {
      if (el.classList.contains("done") || e.button > 0) return;
      e.preventDefault();
      const sx = e.clientX, sy = e.clientY; let ghost = null, last = null;
      try { el.setPointerCapture(e.pointerId); } catch (_) {}
      const mv = ev => {
        if (!ghost && Math.hypot(ev.clientX - sx, ev.clientY - sy) > 8) {
          ghost = el.cloneNode(true); ghost.classList.add("dragghost"); ghost.classList.remove("sel"); document.body.append(ghost); el.classList.add("dragging");
        }
        if (ghost) {
          ghost.style.left = ev.clientX + "px"; ghost.style.top = ev.clientY + "px";
          if (ev.clientY > innerHeight - 50) scrollBy(0, 14); else if (ev.clientY < 90) scrollBy(0, -14);
          const z = zoneAt(ev.clientX, ev.clientY);
          if (z !== last) { last && last.classList.remove("hover"); z && z.classList.add("hover"); last = z; }
        }
      };
      const up = ev => {
        el.removeEventListener("pointermove", mv); el.removeEventListener("pointerup", up); el.removeEventListener("pointercancel", up);
        if (ghost) {
          ghost.remove(); el.classList.remove("dragging"); last && last.classList.remove("hover");
          const z = ev.type === "pointerup" ? zoneAt(ev.clientX, ev.clientY) : null;
          if (z && DnD.onDrop) { DnD.clear(); DnD.onDrop(el, z); }
        } else DnD.select(el);
      };
      el.addEventListener("pointermove", mv); el.addEventListener("pointerup", up); el.addEventListener("pointercancel", up);
    });
    el.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); DnD.select(el); } });
    el.tabIndex = 0;
  }
};
function zoneAt(x, y) { const t = document.elementFromPoint(x, y); return t ? t.closest(".dz") : null; }
document.addEventListener("click", e => {
  const z = e.target.closest(".dz");
  if (z && DnD.sel && DnD.onDrop && !e.target.closest(".chip")) { const it = DnD.sel; DnD.clear(); DnD.onDrop(it, z); }
});
function chip(it) {
  const c = h("span", { class: "chip", role: "button", "aria-label": it.t }, it.e ? h("span", { class: "e" }, it.e) : null, it.t);
  c._it = it; DnD.make(c); return c;
}

/* ============ CONFETTI ============ */
function confetti(n = 28) {
  const set = ["🎉", "⭐", "✨", "🌟", "🎊"];
  for (let i = 0; i < n; i++) {
    const s = h("div", { class: "confetti" }, set[i % set.length]);
    s.style.left = Math.random() * 100 + "vw"; s.style.animationDuration = 1.8 + Math.random() * 1.8 + "s"; s.style.animationDelay = Math.random() * .5 + "s";
    document.body.append(s); setTimeout(() => s.remove(), 4200);
  }
}

function mapSVG({ eq = true, labels = [], extra = "" } = {}) {
  const W = (MAP.lon1 - MAP.lon0) * MAP.k, H = (MAP.lat0 - MAP.lat1) * MAP.k;
  let s = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Peta sederhana Indonesia dan sekitarnya">`;
  s += `<defs><pattern id="wv" width="40" height="20" patternUnits="userSpaceOnUse"><path d="M0 10 q10 -6 20 0 t20 0" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="1.5"/></pattern></defs>`;
  s += `<rect width="${W}" height="${H}" fill="var(--sea)"/><rect width="${W}" height="${H}" fill="url(#wv)"/>`;
  for (const k in LAND) { const L = LAND[k]; s += `<path class="land ${L.c}" d="M${L.p.map(p => PX(p[0], p[1]).map(v => v.toFixed(1)).join(" ")).join(" L")}Z"/>`; }
  if (eq) { const [x0, y0] = PX(MAP.lon0, 0), [x1] = PX(MAP.lon1, 0); s += `<line class="eq" x1="${x0}" y1="${y0}" x2="${x1}" y2="${y0}"/>`; }
  for (const l of labels) { const [x, y] = PX(l[0], l[1]); s += `<text class="maplabel" x="${x}" y="${y}" text-anchor="middle">${l[2]}</text>`; }
  s += extra + `</svg>`;
  return s;
}

/* ============ MESIN 1: PILAH (sorter) ============ */
// rounds: [{prompt, bins:[{id,t,e,sub}], items:[{t,e,bin,why}]}]
function sorter(api, rounds, notes, onDone, progBase = 0, progSpan = 1) {
  let r = 0, total = rounds.reduce((a, x) => a + x.items.length, 0), first = 0, doneN = 0;
  const tried = new Set();
  function round() {
    const R = rounds[r], st = api.stage; st.innerHTML = "";
    st.append(h("div", { class: "prompt" }, `Babak ${r + 1}/${rounds.length} · ${R.prompt}`));
    st.append(h("p", { class: "small muted" }, "Seret kartu ke kotak yang tepat — atau ketuk kartu lalu ketuk kotaknya."));
    const tray = h("div", { class: "tray" });
    shuffle(R.items).forEach(it => tray.append(chip(it)));
    const bins = h("div", { class: "bins" });
    R.bins.forEach(b => bins.append(h("div", { class: "bin dz", "data-id": b.id },
      h("h4", {}, h("span", { class: "e" }, b.e || ""), b.t), b.sub ? h("div", { class: "sub" }, b.sub) : null, h("div", { class: "in" }))));
    st.append(tray, bins);
    let left = R.items.length;
    DnD.onDrop = (c, z) => {
      const it = c._it, key = r + "|" + it.t;
      if (z.dataset.id === it.bin) {
        if (!tried.has(key)) first++;
        c.classList.remove("sel"); c.classList.add("done"); $(".in", z).append(c);
        z.classList.add("good"); setTimeout(() => z.classList.remove("good"), 500);
        SND.ok(); fb(`<b>${it.t}</b> ✔ ${it.why}`, "ok"); left--; doneN++;
        api.prog(progBase + progSpan * doneN / total); if (!onDone) api.score(first / total * 100);
        if (!left) setTimeout(() => { r++; r < rounds.length ? round() : (onDone ? onDone(first / total * 100) : api.finish(first / total * 100, notes)); }, 900);
      } else {
        tried.add(key); SND.bad(); c.classList.add("shake"); z.classList.add("wrong");
        setTimeout(() => { c.classList.remove("shake"); z.classList.remove("wrong"); }, 450);
        fb(`<b>${it.t}</b> belum tepat di sini. ${it.hint || "Petunjuk: " + it.why}`, "bad", 6500);
      }
    };
  }
  round();
}

// cards: urutan benar. Pemain mengetuk kartu untuk mengisi urutan.
function sequencer(api, { prompt, cards, why }, onDone) {
  const st = api.stage; st.innerHTML = "";
  st.append(h("div", { class: "prompt" }, prompt), h("p", { class: "small muted" }, "Ketuk kartu sesuai urutan. Ketuk kartu di urutan untuk mengembalikannya."));
  const slots = h("div", { class: "slots", style: "flex-direction:column;align-items:stretch" });
  const pool = h("div", { class: "tray" });
  let seq = [], tries = 0;
  const draw = () => {
    slots.innerHTML = "";
    cards.forEach((_, i) => {
      const c = seq[i];
      const s = h("div", { class: "slot", style: "min-height:52px;flex-direction:row;gap:8px;justify-content:flex-start" }, h("span", { class: "badge", style: "background:var(--boss)" }, i + 1), c ? h("span", {}, c.e + " " + c.t) : h("span", { class: "muted small" }, "…"));
      if (c) s.onclick = () => { seq.splice(i, 1); SND.click(); draw(); };
      slots.append(s);
    });
    pool.innerHTML = "";
    shuffledCards.filter(c => !seq.includes(c)).forEach(c => pool.append(h("button", { class: "opt", onclick: () => { seq.push(c); SND.pick(); draw(); } }, c.e + " " + c.t)));
    chk.disabled = seq.length !== cards.length;
  };
  const shuffledCards = shuffle(cards);
  const chk = h("button", { class: "btn alt" }, "✔ Periksa urutan");
  chk.onclick = () => {
    tries++;
    const wrong = seq.map((c, i) => c !== cards[i]);
    $$(".slot", slots).forEach((s, i) => s.classList.add(wrong[i] ? "wrong" : "good"));
    if (wrong.some(Boolean)) { SND.bad(); fb(`Ada ${wrong.filter(Boolean).length} kartu yang posisinya belum tepat (kotak merah). Pikirkan: apa yang menjadi <b>sebab</b>, dan apa <b>akibatnya</b>?`, "bad", 6500); setTimeout(() => { seq = seq.filter((c, i) => !wrong[i] && seq.slice(0, i).every((x, j) => !wrong[j])); draw(); }, 1300); }
    else { SND.ok(); fb(why, "ok", 8000); setTimeout(() => onDone(Math.max(40, 100 - (tries - 1) * 20)), 1500); }
  };
  st.append(slots, pool, h("div", { class: "row c" }, chk));
  draw();
}

/* -------- Lab Sawah: model populasi sederhana (diskrit, mingguan) --------
   Padi (P, % tutupan sawah) tumbuh logistik dan dimakan tikus.
   Tikus (T) bertambah bila padi banyak, berkurang karena mati alami & dimangsa ular/burung hantu.
   Ular (U) bertambah dari tikus yang dimangsa, berkurang karena mati alami & diburu.
   Penyederhanaan: model mangsa–pemangsa ala Lotka–Volterra; angka bukan data lapangan. */
function sawahModel(o) {
  let P = o.P ?? 75, T = o.T ?? 30, U = o.U ?? 8, H = o.H ?? 0, pol = 0; const out = [];
  if (o.burn) { P *= 0.3; pol += 30; }
  for (let w = 0; w <= 24; w++) {
    out.push({ w, P, T, U, pol });
    const g = 0.35 * (P / 100) - 0.1025;
    const nP = P + 0.18 * P * (1 - P / 100) - 0.142 * T * P / (P + 20);
    const nT = T + g * T - 0.02 * U * T - 0.02 * H * T - (o.poison ? 0.3 * T : 0);
    const nU = U + 0.002 * U * T - 0.06 * U - (o.hunt ? 0.4 * U : 0) - (o.poison ? 0.15 * U : 0);
    P = clamp(nP, 0, 100); T = Math.max(0, nT); U = Math.max(0, nU); if (o.poison) pol += 4;
  }
  return out;
}

        if (i >= qs.length || lives <= 0) return end();
        lock = false; left = 15; q.textContent = qs[i][0]; drawTop(); $("i", tb).style.width = "100%";
        clearInterval(timer);
        timer = setInterval(() => { left -= .1; $("i", tb).style.width = left / 15 * 100 + "%"; if (left <= 0) answer(null); }, 100);
      };
      const answer = v => {
        if (lock) return; lock = true; clearInterval(timer);
        const [_, ans, why] = qs[i];
        if (v === ans) { correct++; streak++; SND.ok(); fb("✔ " + why, "ok", 3500); }
        else { lives--; streak = 0; SND.bad(); fb((v === null ? "⏰ Waktu habis! " : "") + why, "bad", 4500); }
        i++; api.prog(.3 + .7 * i / qs.length); api.score(s1 * .4 + correct / qs.length * 60);
        drawTop(); setTimeout(next, 1700);
      };
      bT.onclick = () => answer(true); bF.onclick = () => answer(false);
      next();
    });
  } });

function rapor() {
  const date = new Date().toLocaleDateString("id-ID", { day: "numeric", month: "long", year: "numeric" });
  const box = h("div", {});
  box.append(h("h2", {}, "📋 Rapor Ekspedisi Nusantara"), h("p", {}, `Nama: `, h("b", {}, S.name || "-"), ` · Tanggal: ${date}`));
  const groups = [...WORLDS.map(w => [w, LEVELS.filter(l => l.world === w.id)]), [{ name: "Ekspedisi Akhir", bab: "Review" }, LEVELS.filter(l => l.world === "boss")]];
  const sum = h("div", { class: "kpi", style: "margin-bottom:8px" });
  groups.forEach(([w, ls]) => { const played = ls.filter(l => S.best[l.id]); const avg = played.length ? Math.round(played.reduce((a, l) => a + S.best[l.id], 0) / ls.length) : 0; sum.append(h("span", { class: "pill" }, `${w.bab}: ${avg}`)); });
  box.append(h("p", { class: "small muted" }, "Nilai bab = rata-rata nilai terbaik semua tantangan di bab itu (tantangan yang belum dimainkan dihitung 0)."), sum);
  const t = h("table", { class: "rap" }, h("tr", {}, h("th", {}, "Tantangan"), h("th", {}, "Tujuan pembelajaran (Aku bisa…)"), h("th", {}, "Nilai"), h("th", {}, "Status")));
  const recs = [];
  groups.forEach(([w, ls]) => ls.forEach(l => {
    const v = S.best[l.id] || 0;
    const status = !v ? ["Belum dimainkan", "#999"] : v >= 70 ? ["Tuntas", "var(--ok)"] : ["Perlu latihan", "var(--warn)"];
    if (v < 70) recs.push(`${l.em} ${l.title} — ${l.ref}`);
    t.append(h("tr", {}, h("td", {}, h("b", {}, `${l.em} ${l.title}`), h("br"), h("span", { class: "small muted" }, w.bab)), h("td", { class: "small" }, l.tp), h("td", { html: `<b>${v}</b><br><span class="stars small">${starStr(stars(v))}</span>` }), h("td", {}, h("span", { class: "badge", style: `background:${status[1]}` }, status[0]))));
  }));
  box.append(t);
  box.append(h("h3", {}, "Saran belajar"), recs.length ? h("ul", { class: "small" }, recs.map(r => h("li", {}, r))) : h("p", {}, "Masya Allah! Semua tantangan tuntas. Pertahankan dan bantu temanmu belajar."));
  box.append(h("div", { class: "row c noprint" }, h("button", { class: "btn", onclick: () => window.print() }, "🖨️ Cetak / Simpan PDF"), h("button", { class: "btn ghost", onclick: closeModal }, "Tutup")));
  modal(box);
}
